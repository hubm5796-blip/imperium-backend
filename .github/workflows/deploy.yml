# V6 01-04 — backend deploy. Runs AFTER CI on master. Requires repo secrets
# (owner action, one time): CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in
# the 'backend' environment. Until those exist this workflow skips cleanly.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply D1 migrations (schema precedes code)
        run: npx wrangler d1 migrations apply CACHE_DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        # --var bakes the commit + timestamp into /health so a probe can tell
        # WHICH deploy is live (the 2026-08-27 outage hunt showed version:"dev"
        # forever because nothing stamped it).
        run: >
          npx wrangler deploy
          --var DEPLOY_VERSION:$(git rev-parse --short HEAD)
          --var DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: curl -fsS --max-time 15 https://api.imperiummc.net/api/v2/ping
