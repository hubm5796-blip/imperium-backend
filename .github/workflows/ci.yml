# DISABLED ON PURPOSE (owner 2026-10-30): GitHub Actions is permanently off for this org
# (free-plan minutes exhausted; not paying). All checks run LOCALLY via scripts/local-check.sh
# before every merge/deploy — never re-enable this workflow, never add or trigger one.
# V6 01-04 — backend CI. Deploys stay owner-gated (deploy.yml needs the
# CLOUDFLARE_API_TOKEN secret); this workflow only proves the build+tests.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler config validation (dry run)
        run: npx wrangler deploy --dry-run --outdir=dist-worker
        continue-on-error: false
