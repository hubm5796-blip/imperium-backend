# V6 01-04 — backend CI. Deploys stay owner-gated (deploy.yml needs the
# CLOUDFLARE_API_TOKEN secret); this workflow only proves the build+tests.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Wrangler config validation (dry run)
        run: npx wrangler deploy --dry-run --outdir=dist-worker
        continue-on-error: false
